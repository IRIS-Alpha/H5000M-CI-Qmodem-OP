<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <!-- 可访问性修复：移除 maximum-scale / user-scalable=no，允许用户缩放 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#020617">
    <meta name="description" content="Hiveton H5000M 鼎桥 MT5700M 5G CPE & AirPi AP3000M 定制 ImmortalWrt 固件 - 每日自动构建，支持 5G + Wi-Fi 7 + 智能温控。AP3000M 开源 mt76 驱动，EEPROM 自动初始化。内置 QModem Generic / QModem Next / homeproxy / easytier / 存储共享等丰富插件。">
    <meta name="keywords" content="H5000M, AP3000M, AirPi, ImmortalWrt, 鼎桥 MT5700M, OpenWrt, 5G CPE, 路由器固件, MediaTek Filogic, mt76, QModem">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

        :root {
            --bg-base: #020617;
            --accent-cyan: #22d3ee;
            --accent-blue: #3b82f6;
        }

        body {
            font-family: 'Noto Sans SC', system-ui, sans-serif;
            background-color: var(--bg-base);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* 细节优化：定制暗黑模式滚动条 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        .font-mono { font-family: 'JetBrains Mono', monospace; }

        /* 锚点跳转时避开固定导航 + 吸顶时间栏 */
        section[id], header[id] { scroll-margin-top: 128px; }

        .custom-bg {
            position: fixed;
            inset: 0;
            background: url('https://files.seeusercontent.com/2026/06/29/uu4H/bg1.jpg') center/cover no-repeat;
            opacity: 0.22;
            z-index: -2;
            pointer-events: none;
        }

        .glass-card {
            background: linear-gradient(145deg, rgba(255,255,255,0.035) 0%, rgba(255,255,255,0.008) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 4px 30px -8px rgba(0,0,0,0.6);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            transform: translateY(-6px);
            background: linear-gradient(145deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0.015) 100%);
            border-color: rgba(34, 211, 238, 0.35);
            box-shadow: 0 25px 50px -12px rgba(34, 211, 238, 0.18);
        }

        /* 细节优化：光晕改为响应式尺寸，适配 4K 及移动端 */
        .ambient-glow {
            position: absolute;
            width: 70vw;
            max-width: 800px;
            height: 70vw;
            max-height: 800px;
            background: radial-gradient(circle, rgba(34,211,238,0.15) 0%, transparent 70%);
            border-radius: 50%;
            top: -15%;
            left: 50%;
            transform: translateX(-50%);
            animation: pulse-glow 10s ease-in-out infinite alternate;
            z-index: -1;
            pointer-events: none;
        }

        @keyframes pulse-glow {
            0% { opacity: 0.5; transform: translateX(-50%) scale(0.95); }
            100% { opacity: 0.9; transform: translateX(-50%) scale(1.05); }
        }

        .text-gradient {
            background: linear-gradient(135deg, #f8fafc 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .text-gradient-cyan {
            background: linear-gradient(135deg, #22d3ee 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-btn {
            position: relative;
            overflow: hidden;
        }

        .hero-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: translateX(-150%) skewX(-15deg);
            transition: transform 0.7s ease-in-out;
        }

        .hero-btn:hover::after {
            transform: translateX(200%) skewX(-15deg);
        }

        /* 滚动入场动画 */
        .reveal {
            opacity: 0;
            transform: translateY(24px);
            transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1),
                        transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .reveal.is-visible {
            opacity: 1;
            transform: none;
        }
        /* 卡片级联延迟 */
        .stagger > .reveal:nth-child(2) { transition-delay: 0.08s; }
        .stagger > .reveal:nth-child(3) { transition-delay: 0.16s; }
        .stagger > .reveal:nth-child(4) { transition-delay: 0.24s; }
        .stagger > .reveal:nth-child(5) { transition-delay: 0.32s; }
        .stagger > .reveal:nth-child(6) { transition-delay: 0.40s; }

        /* 键盘可访问性：统一焦点样式 */
        a:focus-visible,
        button:focus-visible {
            outline: 2px solid var(--accent-cyan);
            outline-offset: 3px;
            border-radius: 6px;
        }

        /* 尊重用户的减少动态偏好 */
        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            .reveal { opacity: 1; transform: none; transition: none; }
            .ambient-glow { animation: none; }
            .hero-btn::after { display: none; }
        }

        /* 插件 chip 样式 */
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            padding: 0.35rem 0.7rem;
            border-radius: 9999px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            color: #cbd5e1;
            transition: all 0.25s ease;
        }
        .chip:hover {
            border-color: rgba(34,211,238,0.4);
            color: #fff;
            background: rgba(34,211,238,0.08);
        }
        .chip i { font-size: 0.7rem; opacity: 0.7; }
    </style>
</head>
